  reload-success: "&aModBlocker 的配置与语言文件已重载。"
  usage: "&e用法：/modblocker <reload | check <玩家> | violations <玩家> | clear <玩家> [模组] | exempt <add|remove|list> [玩家]>"
  player-not-found: "&c玩家 %player% 不在线或不存在。"
  check-header: "&b正在检查 &f%player% &b的模组插件频道："
  check-channels: "&7已注册的频道："
