    replay: "&c检测到 Replay Mod！请关闭 Replay Mod 后再进服。"

# 阶梯处罚（累犯计数）系统，仅在 config.yml 里 escalation.enabled 为 true 时生效。
# 若某一级在 config.yml 中写了自己的 `message:`，则会覆盖这里对应的文本。
# 占位符：%player% %mod% %count% %step% %steps% %next% %duration% %reason% %source% %action%
escalation:
  warn: "&e&l警告 &r&f检测到你正在使用 &c%mod%&f，本服禁止该模组。&7（第 %count% 次）&f请尽快卸载，否则将被移出服务器。"
  kick: "&c&l警告：&f本服禁止 &c%mod%&c。\n&7这是第 &f%count% &7次，再带着它进服将受到更严厉的处罚。"
  ban: "&4&l已封禁：&f你在被警告后仍带着 &c%mod%&f 进服。\n&7累计 &f%count% &7次 &7| 时长：&f%duration%"
  # 发送给拥有通知权限的管理员（遵循 config.yml 里的 notifyStaff）。
  notify: "&e%player% &7触发阶梯处罚第 &f%step%&7/&f%steps% &7级（&f%action%&7），模组：&f%mod%&7，第 &f%count% &7次"
  # 每次触发阶梯处罚时打印到控制台的行。
  log: "%player% 因 %mod%（来源：%source%）累计违规 %count% 次 -> 第 %step%/%steps% 级：%action%"
  duration-permanent: "永久"
  next-none: "-"
  action-warn: "警告"
  action-kick: "踢出"
  action-ban: "封禁"
  action-command: "执行命令"
  action-ignore: "忽略"

# 虚拟告示牌检测。仅在 extra-detections.sign-translation.evade-action 为 KICK 时使用。
sign:
  evade-kick: "&c&l模组检测未能完成&r\n&7请关闭正在打开的界面（菜单 / 对话框 / 资源包确认框）后重新进服。"

