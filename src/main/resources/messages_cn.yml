    worldinfo: "&c检测到 World Info 模组！本服禁止使用该模组。"
    tweakeroo: "&c检测到 Tweakeroo！请关闭后再进服。"
    creativecore: "&c检测到 CreativeCore，它常与其他整合包模组一起出现，请关闭后再试。"
    minimapsync: "&c检测到 MinimapSync！请卸载所有地图类工具。"
    "servux:tweaks": "&c检测到 Servux（Tweakeroo 频道）！本服禁止使用 Tweakeroo。"
    "servux:structures": "&c检测到 Servux（结构 / MiniHUD 频道）！本服禁止使用 MiniHUD。"
    axiom: "&c检测到 Axiom！本服禁止使用该客户端。"
