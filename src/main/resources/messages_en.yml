prefix: "&7[&cModBlocker&7] "

log:
  channel-list: "Player %player% is listening on plugin channels: %channels%"
  detected-mods: "%player% is using forbidden mods: %mods%"
  plugin-message: "%player% sent mod-related plugin message: %mod%"
  unknown-channel: "unknown channel: %channel%"

kick:
  reason-default: "&c&lWarning: Detected unauthorized modifications! This server strictly prohibits cheating mods and hacked clients. Please disable them and rejoin."
  mods:
    fabric: "&cFabric mod detected! Please disable it before joining the server."
    forge: "&cForge detected! Please disable it before joining the server."
    xaeroworldmap: "&cXaero's World Map detected! Please disable all mapping mods before joining."
    xaerominimap: "&cXaero's Minimap detected! Please remove all minimap mods to play here."
    worldinfo: "&cWorld Info mod detected! This mod is not allowed on this server."
    tweakeroo: "&cTweakeroo detected! Please disable Tweakeroo to join."
    creativecore: "&cCreativeCore detected, which is often used with other modpacks. Please disable it."
    minimapsync: "&cMinimapSync mod detected! Please disable all mapping utilities."
    "servux:tweaks": "&cServux (Tweakeroo channel) detected! Tweakeroo is not permitted on this server."
    "servux:structures": "&cServux (Structures/MiniHUD channel) detected! MiniHUD is not permitted on this server."
    axiom: "&cAxiom detected! This client is not allowed."
    freecam: "&cFreecam mod detected! Freecam or spectating mods are prohibited here."
    flashback: "&cFlashback mod detected! Please play without time manipulation mods."
    voxelmap: "&cVoxelMap detected! Mapping mods like VoxelMap are not permitted."
    replay: "&cReplay Mod detected! Please disable Replay Mod before joining."

# Escalation ("strike") system. Only used when escalation.enabled is true in config.yml.
# A ladder rung with its own `message:` overrides the matching entry here.
# Placeholders: %player% %mod% %count% %step% %steps% %next% %duration% %reason% %source% %action%
escalation:
  warn: "&e&lWARNING &r&fYou are using &c%mod%&f, which is not allowed here. &7(strike %count%) &fRemove it before you are removed from the server."
  kick: "&c&lWarning: &f%mod% &cis not allowed on this server.\n&7This is strike &f%count%&7. Joining again with it will be punished harder."
  ban: "&4&lBanned: &fyou rejoined with &c%mod%&f after being warned.\n&7Strikes: &f%count% &7| Duration: &f%duration%"
  # Sent to staff with the notify permission (respects notifyStaff in config.yml).
  notify: "&e%player% &7hit escalation step &f%step%&7/&f%steps% &7(&f%action%&7) for &f%mod%&7, strike &f%count%"
  # Console line for every escalated detection.
  log: "%player% reached violation %count% for %mod% (%source%) -> step %step%/%steps%: %action%"
  duration-permanent: "permanent"
  next-none: "-"
  action-warn: "warn"
  action-kick: "kick"
  action-ban: "ban"
  action-command: "command"
  action-ignore: "ignore"

# Virtual sign check. Only used when extra-detections.sign-translation.evade-action is KICK.
sign:
  evade-kick: "&c&lThe mod check could not be completed&r\n&7Close any open screen (menu, dialog, resource pack prompt) and rejoin."

command:
  no-permission: "&cYou do not have permission to use this command."
  reload-success: "&aModBlocker configuration and messages reloaded successfully."
  usage: "&eUsage: /modblocker <reload | check <player> | violations <player> | clear <player> [mod] | exempt <add|remove|list> [player]>"
  player-not-found: "&cPlayer %player% is not online or does not exist."
  check-header: "&bChecking MOD plugin channels for &f%player%&b:"
  check-channels: "&7Registered channels:"
  check-matched: "&cMatched forbidden keywords:"
  check-none: "&aNo forbidden MOD keywords detected."
  sign-check-triggered: "&eSign translation detection started for &f%player%&e. Watch console for results."
  sign-check-skipped: "&7Sign translation detection skipped for &f%player%&7: &f%reason%"
  # Shown after sign-check-skipped only when that message has no %reason% placeholder.
  sign-check-reason-prefix: "&7Reason: &f"
  sign-check-reason-disabled: "disabled in config (extra-detections.sign-translation.enabled)"
  sign-check-reason-bedrock: "Bedrock player, skipped via Floodgate"
  sign-check-reason-unsupported: "this server/API does not support the virtual sign check"
  sign-check-reason-bridge: "the detection listener failed to register - see console"
  sign-check-reason-failed: "the check could not be started - see console"
  sign-check-reason-unavailable: "plugin is not initialized"
  violations-header: "&bViolation record for &f%player%&b:"
  violations-entry: "&7- &f%mod%&7: &c%count% &7(last: &f%time%&7)"
  violations-expired: " &8(expired)"
  violations-global-label: "any mod"
  violations-none: "&aNo violations recorded for &f%player%&a."
  violations-disabled: "&7Note: escalation is currently disabled in config.yml."
  clear-success: "&aCleared &f%count%&a violation record(s) for &f%player%&a."
  clear-none: "&7No violation records found for &f%player%&7."
  escalation-unavailable: "&cThe escalation system is not initialized."
  exempt-usage: "&eUsage: /modblocker exempt <add | remove | list> [player]"
  exempt-unavailable: "&cThe exemption list is not initialized."
  exempt-added: "&a%player% is now exempt from every check."
  exempt-added-pending: "&a%player% is now exempt. They have never joined this server, so the entry locks onto their UUID the first time they log in."
  exempt-already: "&7%player% is already exempt."
  exempt-removed: "&a%player% is no longer exempt."
  exempt-not-found: "&7%player% was not on the exemption list."
  exempt-list-header: "&bExempt from all checks (&f%count%&b):"
  exempt-list-entry: "&7- &f%player%"
  exempt-list-pending: " &8(awaiting first login)"
  sign-check-reason-exempt: "this player is exempt from all checks"

# Shown to players when force-xaero-fairplay runs with silent: false.
xaero:
  notice: "&7[Map] &fThis server enforces fair-play mapping: cave mode and entity radar are disabled."
